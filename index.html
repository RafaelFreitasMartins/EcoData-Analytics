<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="utf-8"/>

<title>Início - EcoData Analytics</title>
<!-- Importando a fonte Montserrat para o título -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&amp;display=swap" rel="stylesheet"/>
<style>
        :root {
            --primary-color: #2e7d32;
            --secondary-color: #4caf50;
            --bg-color: #f1f8e9;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('assets/img/amazon_river_hd.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            z-index: -1;
            opacity: 1;
        }

        .home-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-width: 650px;
            width: 85%;
            backdrop-
        }

        .logo {
            max-width: 160px;
            height: auto;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--primary-color);
            font-family: 'Montserrat', sans-serif; /* Aplicando a nova fonte aqui */
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-top: -10px;
            margin-bottom: 35px;
        }

        h2 {
            color: #666;
            font-size: 1.1rem;
            font-weight: normal;
            margin-bottom: 30px;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 15px 25px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn.secondary {
            background-color: #f39c12;
        }
        
        .btn.secondary:hover {
            background-color: #e67e22;
        }

        .btn:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.4);
            padding: 8px 20px;
            border-radius: 20px;
        }
    
        /* Responsividade Global para Celulares e Tablets */
        @media (max-width: 768px) {
            .top-header {
                flex-direction: column;
                height: auto !important;
                padding: 15px 10px 5px 10px !important;
                position: relative !important;
            }
            .logo-container {
                margin-bottom: 10px;
                justify-content: center;
                width: 100%;
            }
            .menu {
                width: 100%;
                overflow-x: auto;
                justify-content: flex-start !important;
                padding-bottom: 10px;
            }
            .menu-item a {
                white-space: nowrap;
                padding: 8px 12px !important;
                font-size: 13px !important;
            }
            .page-content {
                padding: 20px 15px !important;
            }
            
            /* Ajustes Tema e PDF */
            .dark-card {
                padding: 20px !important;
                width: 95% !important;
                max-height: 85vh !important;
                overflow-y: auto;
            }
            .dark-card h2 {
                font-size: 1.3rem !important;
            }
            .dark-card i {
                font-size: 40px !important;
                margin-bottom: 10px !important;
            }

            /* Ajustes Desafio */
            .cards-grid {
                grid-template-columns: 1fr !important;
                gap: 20px !important;
            }
            .flip-card {
                height: 480px !important;
            }
            .flip-card-front, .flip-card-back {
                padding: 20px !important;
            }
            .question {
                font-size: 1rem !important;
            }

            /* Ajustes Eventos / Fenômenos */
            .phenomenon-grid {
                grid-template-columns: 1fr !important;
            }
            .title-section h1 {
                font-size: 1.6rem !important;
            }
            .card {
                padding: 20px !important;
            }
            .card h2 {
                font-size: 1.4rem !important;
            }
            
            /* Ajustes Participantes */
            .cards-row {
                gap: 15px !important;
            }
            .profile-card {
                width: 100% !important;
                max-width: 320px;
            }
            .profile-img {
                height: 300px !important;
            }
            
            /* Ajustes Power BI */
            .iframe-container {
                min-height: 400px !important;
            }
        }
</style>

    <style>
        @media (max-width: 768px) {
            .audio-hints {
                bottom: 15px !important;
                left: 15px !important;
                gap: 5px !important;
            }
            .audio-hints div {
                font-size: 0.8rem !important;
                padding: 6px 10px !important;
            }
            .audio-hints i {
                font-size: 1.1rem !important;
            }
        }
    </style>

</head>
<body>
<div class="home-container">
<img alt="Logo Atualizado" class="logo" src="assets/img/Logo novo_transparent.png"/>
<h1>EcoData Analytics</h1>
<div class="btn-container">
<a class="btn" href="tema.html">Tema</a>
</div>
</div>
<footer>
        © 2026 - TCC Agroclima na Amazônia
    </footer>

    <audio id="bg-audio" src="assets/media/som_fundo.mp4" autoplay loop></audio>
    <script>

        // Define o volume inicial do som ambiente (0.0 a 1.0)
        document.getElementById('bg-audio').volume = 0.3;

        // Força a reprodução no primeiro clique na tela caso o autoplay seja bloqueado pelo navegador
        document.body.addEventListener('click', function() {
            var audio = document.getElementById('bg-audio');
            if (audio.paused) {
                audio.play().catch(e => console.log("Audio play failed:", e));
            }
        });

        // Desliga o som imediatamente ao clicar no botão TEMA
        var temaBtn = document.querySelector('a.btn[href="tema.html"]');
        if (temaBtn) {
            temaBtn.addEventListener('click', function() {
                document.getElementById('bg-audio').pause();
            });
        }
    
        // Para o som ao usar o scroll do mouse ou rolar a tela
        function stopAudioOnScroll() {
            var audio = document.getElementById('bg-audio');
            if (!audio.paused) {
                audio.pause();
            }
        }
        window.addEventListener('wheel', stopAudioOnScroll, { passive: true });
        window.addEventListener('scroll', stopAudioOnScroll, { passive: true });
        window.addEventListener('touchmove', stopAudioOnScroll, { passive: true });
    </script>
    <div class="audio-hints" style="position: absolute; bottom: 30px; left: 30px; z-index: 10;">
        <div style="display: flex; flex-direction: column; gap: 8px; color: rgba(255, 255, 255, 0.9); font-family: 'Inter', sans-serif; font-size: 0.8rem; background: rgba(0,0,0,0.5); padding: 12px 18px; border-radius: 8px; backdrop-filter: blur(5px); box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
            <div style="display: flex; align-items: center; gap: 8px;">
                <i class="ph-fill ph-hand-pointing" style="font-size: 1.1rem; color: #4CAF50;"></i>
                <span>Clique na tela para ativar o som</span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <i class="ph-fill ph-mouse" style="font-size: 1.1rem; color: #f44336;"></i>
                <span>Scrolle para baixo para desativar o som</span>
            </div>
        </div>
    </div>

</body>
</html>
